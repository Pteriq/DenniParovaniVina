<style>
  :root{
    --bg:#1c0609; --bg2:#3b0c18; --ink:#f4e9d8; --muted:#c9b29c; --line:rgba(212,175,106,.28);
    --gold:#d4af6a; --gold-2:#ecd29b; --wine:#8e1b2c; --wine-2:#b02a40;
    --paper:#f5ecdc; --paper-ink:#2b1015; --paper-muted:#76594e; --paper-line:#dcc9a8;
    --good:#4f9a5e; --ok:#b07f14; --meh:#d9783a; --bad:#c8394f;
    --shadow:0 2px 6px rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  html{background:var(--bg)}
  body{min-height:100vh;color:var(--ink);font:16px/1.6 "EB Garamond",Georgia,serif;-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(1200px 600px at 50% -10%,rgba(176,42,64,.45),transparent 60%),
      radial-gradient(900px 700px at 100% 100%,rgba(90,20,40,.5),transparent 60%),
      linear-gradient(180deg,var(--bg2),var(--bg) 55%);
}
  .wrap{max-width:900px;margin:0 auto;padding:34px 18px 70px}
  .sans{font-family:Inter,system-ui,sans-serif}
  header{text-align:center;margin-bottom:28px}
  .crest{width:46px;height:46px;margin:0 auto 8px;display:block}
  .logo{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:clamp(34px,6vw,54px);letter-spacing:.02em;margin:0;line-height:1.05;color:var(--ink)}
  .logo em{font-style:italic;color:var(--gold)}
  .flourish{display:flex;align-items:center;justify-content:center;gap:12px;color:var(--gold);margin:10px auto 6px;max-width:360px}
  .flourish::before,.flourish::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold))}
  .flourish::after{background:linear-gradient(90deg,var(--gold),transparent)}
  .sub{color:var(--muted);font:500 12px Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase}

  /* vinná etiketa */
  .label{position:relative;background:var(--paper);color:var(--paper-ink);border-radius:6px;padding:34px 30px;box-shadow:var(--shadow);
    background-image:radial-gradient(circle at 20% 10%,rgba(255,255,255,.6),transparent 40%),radial-gradient(circle at 90% 90%,rgba(185,150,95,.18),transparent 50%)}
  .label::before{content:"";position:absolute;inset:8px;border:1px solid var(--gold);border-radius:3px;pointer-events:none}
  .label::after{content:"";position:absolute;inset:12px;border:1px solid rgba(212,175,106,.5);border-radius:2px;pointer-events:none}
  .food{text-align:center;position:relative;z-index:1}
  .emoji{font-size:54px;line-height:1;margin:0 auto 6px;width:92px;height:92px;display:grid;place-items:center;border-radius:50%;
    border:1px solid var(--gold);background:radial-gradient(circle,#fffaf0,#efe2c9)}
  .eyebrow{font:600 11px Inter,sans-serif;text-transform:uppercase;letter-spacing:.22em;color:#9b7a3c}
  .food h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:clamp(30px,5vw,42px);margin:4px 0 6px;line-height:1.1;color:var(--wine)}
  .food p{margin:0 auto;max-width:560px;color:var(--paper-muted);font-style:italic;font-size:18px}

  h3{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:28px;margin:38px 0 14px;text-align:center;color:var(--gold-2)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
  .opt{all:unset;cursor:pointer;display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:10px;position:relative;
    background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02));border:1px solid var(--line);
    transition:transform .15s,border-color .15s,background .15s,box-shadow .15s}
  .opt:hover{transform:translateY(-2px);border-color:var(--gold);background:linear-gradient(180deg,rgba(212,175,106,.14),rgba(212,175,106,.04));box-shadow:0 10px 24px rgba(0,0,0,.35)}
  .opt:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .opt svg.g{flex:0 0 auto}
  .opt .txt{display:flex;flex-direction:column;min-width:0}
  .opt .n{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:21px;line-height:1.15}
  .opt .t{font:500 11px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:3px}
  .opt.done{cursor:default;padding-right:64px}
  .opt.done:hover{transform:none;box-shadow:none;border-color:var(--line);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.02))}
  .opt.picked,.opt.picked:hover{border:1px solid var(--gold);box-shadow:0 0 0 1px var(--gold) inset}
  .opt.best,.opt.best:hover{background:linear-gradient(180deg,rgba(79,154,94,.22),rgba(79,154,94,.06))}
  .opt .sc{position:absolute;right:16px;top:50%;transform:translateY(-50%);font:600 15px Inter,sans-serif}

  .result{margin-top:26px;display:none}
  .result.show{display:block;animation:in .4s ease}
  @keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .result > *{position:relative;z-index:1}
  .scoreRow{display:flex;align-items:center;gap:26px;flex-wrap:wrap}
  .glassBox{position:relative;width:96px;flex:0 0 auto;text-align:center}
  .glassBox .v{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:34px;line-height:1;margin-top:4px}
  .verdict{font-family:"Cormorant Garamond",Georgia,serif;font-size:32px;font-weight:700;margin:2px 0 0;line-height:1.1}
  .wineName{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:22px;margin-top:4px;color:var(--paper-ink)}
  .desc{color:var(--paper-muted);margin:4px 0 0;font-style:italic;font-size:17px}
  .why{margin-top:20px;padding:14px 18px;border-left:2px solid var(--wine);background:rgba(142,27,44,.06);font-size:18px}
  .why b{font-family:Inter,sans-serif;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--wine);margin-right:6px}
  .bestBox{margin-top:16px;padding:16px 18px;border:1px solid var(--paper-line);background:rgba(79,154,94,.08);border-radius:4px;font-size:17px}
  .bestBox .eyebrow{color:#3f7d4b}
  .bestBox .bn{font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;font-weight:700;margin:2px 0 4px;color:var(--paper-ink)}
  .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:22px;align-items:center}
  .btn{all:unset;cursor:pointer;padding:10px 20px;border-radius:2px;font:600 12px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;
    background:var(--wine);color:#fbefe0;border:1px solid var(--wine)}
  .btn:hover{background:var(--wine-2)}
  .btn.ghost{background:transparent;color:var(--gold);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:var(--gold)}
  .btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
  .countdown{color:var(--paper-muted);font:500 13px Inter,sans-serif;margin-left:auto}
  .countdown b{font-variant-numeric:tabular-nums;color:var(--paper-ink)}

  details.all{margin-top:20px}
  details.all summary{cursor:pointer;font:600 12px Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--wine)}
  .rank{list-style:none;padding:0;margin:14px 0 0;display:flex;flex-direction:column;gap:0}
  .rank li{padding:12px 2px;border-bottom:1px dotted var(--paper-line)}
  .rank .top{display:flex;justify-content:space-between;gap:10px;font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:20px}
  .rank .top .s{font:600 14px Inter,sans-serif}
  .rank p{margin:2px 0 0;font-size:16px;color:var(--paper-muted)}
  .rank .mine{font:600 11px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:var(--wine);margin-left:6px}
  .bar{height:4px;border-radius:9px;background:var(--paper-line);margin-top:8px;overflow:hidden}
  .bar i{display:block;height:100%}

  .tag{display:inline-flex;align-items:center;gap:6px}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1px rgba(0,0,0,.25) inset}

  .histHead{display:flex;justify-content:center;align-items:center;gap:14px;flex-wrap:wrap;margin-top:44px}
  .histHead h3{margin:0}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0 16px}
  .stat{border:1px solid var(--line);border-radius:8px;padding:14px;text-align:center;background:rgba(255,255,255,.03)}
  .stat b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:34px;line-height:1.1;color:var(--gold-2)}
  .stat span{font:500 11px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
  .hist li{display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:12px 18px;background:rgba(255,255,255,.03)}
  .hist .he{font-size:30px}
  .hist .hd{font:500 11px Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .hist .hf{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:21px;line-height:1.2}
  .hist .hw{font-size:16px;color:var(--muted);font-style:italic}
  .hist .hs{font-family:"Cormorant Garamond",Georgia,serif;font-weight:700;font-size:28px;text-align:right;line-height:1}
  .hist .hs small{display:block;font:500 10px Inter,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:4px}
  .empty{color:var(--muted);text-align:center;padding:24px;border:1px dashed var(--line);border-radius:8px;font-style:italic}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--paper);color:var(--paper-ink);padding:10px 20px;border-radius:2px;font:500 14px Inter,sans-serif;opacity:0;transition:.25s;pointer-events:none;box-shadow:var(--shadow)}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .confirm{display:none;gap:8px;align-items:center;font:500 13px Inter,sans-serif;color:var(--muted)}
  .confirm.show{display:flex}
  footer{text-align:center;color:var(--muted);font-style:italic;font-size:15px;margin-top:44px}
  @media (max-width:560px){ .stats{grid-template-columns:repeat(2,1fr)} .countdown{margin-left:0} .label{padding:30px 20px} .scoreRow{justify-content:center;text-align:center} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <svg class="crest" viewBox="0 0 48 48" aria-hidden="true"><path d="M14 5h20c1 9 1 15-3 20-2 2.5-4.5 3.5-7 3.5S19 27.5 17 25c-4-5-4-11-3-20z" fill="none" stroke="#d4af6a" stroke-width="1.6"/><path d="M15 14h18c-.2 4.5-1 8-3.2 10.6C28 26.8 26 27.6 24 27.6s-4-.8-5.8-3C16 22 15.2 18.5 15 14z" fill="#8e1b2c"/><path d="M24 28.5V41M17 43h14" stroke="#d4af6a" stroke-width="1.6" stroke-linecap="round"/></svg>
    <h1 class="logo">Denní párování <em>vína</em></h1>
    <div class="flourish">❦</div>
    <div class="sub" id="sub"></div>
  </header>

  <section class="label">
    <div class="food">
      <div class="emoji" id="foodEmoji"></div>
      <div>
        <div class="eyebrow">Dnešní jídlo</div>
        <h2 id="foodName"></h2>
        <p id="foodDesc"></p>
      </div>
    </div>
  </section>

  <h3 id="question">Které víno se k tomu hodí nejlépe?</h3>
  <div class="grid" id="options"></div>

  <section class="label result" id="result">
    <div class="scoreRow">
      <div class="glassBox" id="ring"></div>
      <div style="flex:1;min-width:220px">
        <div class="eyebrow">Tvoje volba</div>
        <p class="verdict" id="verdict"></p>
        <div class="wineName" id="pickName"></div>
        <p class="desc" id="pickDesc"></p>
      </div>
    </div>
    <div class="why" id="pickWhy"></div>
    <div class="bestBox" id="bestBox"></div>
    <details class="all">
      <summary>Zobrazit hodnocení všech 10 vín</summary>
      <ul class="rank" id="rank"></ul>
    </details>
    <div class="actions">
      <button class="btn" id="shareBtn">Zkopírovat výsledek</button>
      <div class="countdown">Další výzva za <b id="cd">--:--:--</b></div>
    </div>
  </section>

  <div class="histHead">
    <h3>Tvoje historie</h3>
    <div>
      <button class="btn ghost" id="clearBtn">Vymazat historii</button>
      <span class="confirm" id="confirm">Opravdu smazat?
        <button class="btn" id="yesClear">Ano, smazat</button>
        <button class="btn ghost" id="noClear">Ne</button>
      </span>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <ul class="hist" id="hist"></ul>

  <footer>Každý den o půlnoci nová výzva. Historie se ukládá jen v tomto prohlížeči.</footer>
</div>
<div class="toast" id="toast"></div>

  ["rose",86,"Suché, svěží růžové k pikantnímu masu i koriandru."],
  ["tramin",84,"Aromatika a jemná sladkost ke koření a ananasu."],
  ["lambrusco",82,"Perlivé ovocné červené osvěží a pálivost nezesílí."],
  ["beaujolais",80,"Lehké, chlazené a šťavnaté – k tacos výborné."],
  ["zinfandel",70,"Zralé ovoce sedí, ale vysoký alkohol pálivost zvýrazní."],
  ["malbec",60,"Šťavnaté, ale taniny s chilli trochu pálí."],
  ["cabernet",25,"Taniny a alkohol s chilli – hořké a pálivé."],
  ["barolo",18,"Tvrdé taniny a pálivá salsa jsou nesnesitelné."],
  ["sauternes",15,"Sladké dezertní víno k pikantním tacos nesedí."]]}
];

/* ---------- POMOCNÉ ---------- */
const START = Date.UTC(2026,10,19); // první výzva
const KEY = "denniParovaniVina.historie.v1";
const $ = id => document.getElementById(id);

function todayKey(d=new Date()){
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function dayIndexOf(key){
  const [y,m,d] = key.split("-").map(Number);
  return Math.floor((Date.UTC(y,m-1,d)-START)/86400000);
}
function rng(seed){ // mulberry32
  return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed);
    t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; };
}
function shuffle(arr,seed){
  const a=arr.slice(), r=rng(seed);
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}
function foodForDay(idx){
  if(idx<0) idx=0;
  if(idx<20) return shuffle(FOODS.slice(0,20), 9173)[idx];        // dny 1–20 (beze změny)
  if(idx<40){                                                     // dny 21–40 (9.–28. 12.), kapr na Štědrý den
    const order=["halloumi","burger","srnci","paella","tiramisu","carbonara","caesar","paprikas","tacos","fondue",
                 "pekingska","pstruh","bramboraky","tatarak","cukrovi","kapr","husa","kure","pastika","cheesecake"];
    return FOODS.find(f=>f.id===order[idx-20]);
  }
  const n=FOODS.length, k=idx-40, cycle=Math.floor(k/n);          // dále cyklicky ze všech
  return shuffle(FOODS, 9173+(cycle+1)*7919)[k%n];
}
function label(s){
  if(s>=90) return "Dokonalé párování!";
  if(s>=75) return "Výborná volba";
  if(s>=55) return "Dobré, ale jde to lépe";
  if(s>=35) return "Rozpačité spojení";
  return "Tohle raději ne";
}
function color(s){
  const v = s>=80?"--good":s>=60?"--ok":s>=35?"--meh":"--bad";
  return getComputedStyle(document.documentElement).getPropertyValue(v).trim();
}
const TYPE_COLOR = {bile:"#e6cf7a",cervene:"#8e1b2c",ruzove:"#e79aa6",sumive:"#efe3a6",dezertni:"#d49a3a",fortifikovane:"#5e1626"};
function tag(t){ return `<span class="tag"><span class="dot" style="background:${TYPE_COLOR[t]}"></span>${TYPE_LABEL[t]}</span>`; }
let gid=0;
function glass(fill,level,w,stroke){ // level 0–1
  const id="gl"+(gid++), H=72, top=8, bottom=40, y=bottom-(bottom-top)*level;
  return `<svg class="g" width="${w}" height="${w*1.5}" viewBox="0 0 48 72" aria-hidden="true">
    <defs><clipPath id="${id}"><path d="M10 4h28c1.2 12 1 22-4.5 30-2.6 3.8-6 5.5-9.5 5.5s-6.9-1.7-9.5-5.5C9 26 8.8 16 10 4z"/></clipPath></defs>
    <rect class="fillr" x="0" y="${y}" width="48" height="${H}" fill="${fill}" clip-path="url(#${id})" data-y="${y}"/>
    <path d="M10 4h28c1.2 12 1 22-4.5 30-2.6 3.8-6 5.5-9.5 5.5s-6.9-1.7-9.5-5.5C9 26 8.8 16 10 4z" fill="none" stroke="${stroke}" stroke-width="1.6"/>
    <path d="M24 40v24M14 67h20" stroke="${stroke}" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M14 9c-.4 6 0 12 2 17" stroke="rgba(255,255,255,.55)" stroke-width="1.4" fill="none" stroke-linecap="round"/>
  </svg>`;
}
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

let memHistory = {};
function loadHistory(){
  try{ const r=localStorage.getItem(KEY); if(r) return JSON.parse(r)||{}; }catch(e){}
  return memHistory;
}
function saveHistory(h){
  memHistory=h;
  try{ localStorage.setItem(KEY, JSON.stringify(h)); }catch(e){}
}

/* ---------- STAV DNE ---------- */
const TODAY = todayKey();
const IDX = dayIndexOf(TODAY);
const FOOD = foodForDay(IDX);
const OPTIONS = shuffle(FOOD.o, 31337+IDX*101);
const BEST = FOOD.o.reduce((a,b)=>b[1]>a[1]?b:a);

function renderHeader(){
  const d = new Date().toLocaleDateString("cs-CZ",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
  $("sub").textContent = `Výzva č. ${IDX+1} · ${d}`;
  $("foodEmoji").textContent = FOOD.e;
  $("foodName").textContent = FOOD.n;
  $("foodDesc").textContent = FOOD.d;
}

function renderOptions(picked){
  const box=$("options"); box.innerHTML="";
  OPTIONS.forEach(([wid,score])=>{
    const w=WINES[wid];
    const b=document.createElement("button");
    b.className="opt"+(picked?" done":"")+(picked===wid?" picked":"")+(picked&&wid===BEST[0]?" best":"");
    b.innerHTML = glass(TYPE_COLOR[w.t], .55, 26, "#d4af6a")+`<span class="txt"><span class="n">${esc(w.n)}</span><span class="t">${tag(w.t)}</span></span>`+
      (picked?`<span class="sc" style="color:${color(score)}">${score} %</span>`:"");
    if(!picked) b.addEventListener("click",()=>choose(wid));
    else b.disabled=true;
    box.appendChild(b);
  });
  $("question").textContent = picked ? "Hodnocení dnešních vín" : "Které víno se k tomu hodí nejlépe?";
}

function ring(score){
  const col=color(score);
  return glass("#8e1b2c", score/100, 64, "#9b7a3c").replace('y="','y="40" data-final="')+`<div class="v" style="color:${col}">${score}&nbsp;%</div>`;
}

function renderResult(wid){
  const opt = FOOD.o.find(o=>o[0]===wid), w=WINES[wid], s=opt[1];
  $("ring").innerHTML = ring(s);
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    const r=$("ring").querySelector(".fillr"); if(r){ r.style.transition="y 1.2s ease"; r.setAttribute("y", r.getAttribute("data-final")); r.style.y=r.getAttribute("data-final")+"px"; }
  }));
  $("verdict").textContent = label(s);
  $("verdict").style.color = color(s);
  $("pickName").innerHTML = esc(w.n)+` <span class="sans" style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-muted)">${tag(w.t)}</span>`;
  $("pickDesc").textContent = w.d;
  $("pickWhy").innerHTML = `<b>Proč?</b> ${esc(opt[2])}`;
  const bw=WINES[BEST[0]];
  $("bestBox").innerHTML = wid===BEST[0]
    ? `<div class="eyebrow">🏆 Trefa!</div><div class="bn">Vybral(a) jsi nejlepší možné víno.</div><p class="desc" style="margin:0">Dnes nebylo lepší párování než ${esc(bw.n)} (${BEST[1]} %).</p>`
    : `<div class="eyebrow">🏆 Nejlepší volba dne · ${BEST[1]} %</div><div class="bn">${esc(bw.n)} <span class="sans" style="font-size:11px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-muted)">${tag(bw.t)}</span></div>
       <p class="desc" style="margin:0 0 6px">${esc(bw.d)}</p><div>${esc(BEST[2])}</div>`;
  const sorted = FOOD.o.slice().sort((a,b)=>b[1]-a[1]);
  $("rank").innerHTML = sorted.map(([id,sc,why])=>{
    const ww=WINES[id];
    return `<li><div class="top"><span>${esc(ww.n)}${id===wid?'<span class="mine">tvoje volba</span>':""}</span><span class="s" style="color:${color(sc)}">${sc} %</span></div><div class="t sans" style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--paper-muted)">${tag(ww.t)}</div>
      <p>${esc(why)}</p><div class="bar"><i style="width:${sc}%;background:${color(sc)}"></i></div></li>`;
  }).join("");
  $("result").classList.add("show");
}

function choose(wid){
  const h=loadHistory();
  if(h[TODAY]) return;
  const s=FOOD.o.find(o=>o[0]===wid)[1];
  h[TODAY]={food:FOOD.id,wine:wid,score:s,best:BEST[0]};
  saveHistory(h);
  renderOptions(wid);
  renderResult(wid);
  renderHistory();
  setTimeout(()=>$("result").scrollIntoView({behavior:"smooth",block:"start"}),60);
}

/* ---------- HISTORIE ---------- */
function renderHistory(){
  const h=loadHistory();
  const keys=Object.keys(h).sort().reverse();
  const played=keys.length;
  const avg = played? Math.round(keys.reduce((a,k)=>a+h[k].score,0)/played) : 0;
  const hits = keys.filter(k=>h[k].wine===h[k].best).length;
  // série
  let streak=0; const d=new Date();
  if(!h[todayKey(d)]) d.setDate(d.getDate()-1);
  while(h[todayKey(d)]){ streak++; d.setDate(d.getDate()-1); }
  $("stats").innerHTML = [
    [played,"Odehráno dní"],[played?avg+" %":"–","Průměrné skóre"],[streak,"Série v řadě"],[hits,"Trefa nejlepšího"]
  ].map(([v,l])=>`<div class="stat"><b>${v}</b><span>${l}</span></div>`).join("");
  $("clearBtn").style.display = played?"":"none";
  if(!played){ $("hist").innerHTML=`<li class="empty" style="display:block">Zatím žádná historie. Vyber dnešní víno a začni sbírat body!</li>`; return; }
  $("hist").innerHTML = keys.map(k=>{
    const e=h[k], f=FOODS.find(x=>x.id===e.food)||{e:"🍽️",n:"Neznámé jídlo"}, w=WINES[e.wine]||{n:e.wine}, b=WINES[e.best]||{n:e.best};
    const [y,m,dd]=k.split("-").map(Number);
    const ds=new Date(y,m-1,dd).toLocaleDateString("cs-CZ",{weekday:"short",day:"numeric",month:"long"});
    return `<li><div class="he">${f.e}</div>
      <div><div class="hd">${ds} · výzva č. ${dayIndexOf(k)+1}</div><div class="hf">${esc(f.n)}</div>
      <div class="hw">Tvoje volba: ${esc(w.n)}${e.wine===e.best?" 🏆":` · nejlepší: ${esc(b.n)}`}</div></div>
      <div class="hs" style="color:${color(e.score)}">${e.score} %<small>${label(e.score).replace("!","")}</small></div></li>`;
  }).join("");
}

$("clearBtn").addEventListener("click",()=>{ $("clearBtn").style.display="none"; $("confirm").classList.add("show"); });
$("noClear").addEventListener("click",()=>{ $("confirm").classList.remove("show"); $("clearBtn").style.display=""; });
$("yesClear").addEventListener("click",()=>{
  const h=loadHistory(); const keep = h[TODAY] ? {[TODAY]:h[TODAY]} : {};
  saveHistory(keep); $("confirm").classList.remove("show"); renderHistory(); toast("Starší historie byla smazána");
});

/* ---------- SDÍLENÍ & ODPOČET ---------- */
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("show"),2200); }
$("shareBtn").addEventListener("click",async()=>{
  const e=loadHistory()[TODAY]; if(!e) return;
  const blocks = Math.round(e.score/10);
  const txt = `🍷 Denní párování vína – výzva č. ${IDX+1}\n${FOOD.e} ${FOOD.n}\n${"🟥".repeat(blocks)}${"⬜".repeat(10-blocks)} ${e.score} %${e.wine===e.best?" 🏆":""}`;
  try{ await navigator.clipboard.writeText(txt); toast("Výsledek zkopírován do schránky"); }
  catch(err){ toast("Kopírování se nepodařilo"); }
});
function tick(){
  const now=new Date(), next=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);
  const s=Math.max(0,Math.floor((next-now)/1000));
  if(todayKey(now)!==TODAY){ location.reload(); return; }
  $("cd").textContent=[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,"0")).join(":");
}

/* ---------- START ---------- */
renderHeader();
const done = loadHistory()[TODAY];
renderOptions(done?done.wine:null);
if(done) renderResult(done.wine);
renderHistory();
tick(); setInterval(tick,1000);
</script>
